name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    name: Tests and full pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: make lint
      - run: make test
      - name: Generate, ingest, quality gate, dbt build, export
        run: make pipeline
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-data
          path: docs/data/dashboard.json

  airflow:
    name: Airflow DAG run
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/airflow_home
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pipeline environment
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
      - name: Airflow in its own environment
        run: |
          python -m venv /tmp/airflow
          /tmp/airflow/bin/pip install -q "apache-airflow==3.4.0" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.4.0/constraints-3.11.txt"
      - name: Land source data for the run
        run: make data ingest
      - name: Run the DAG for today
        run: |
          /tmp/airflow/bin/airflow db migrate
          test -z "$(/tmp/airflow/bin/airflow dags list-import-errors -o plain | grep -v 'No data found')"
          /tmp/airflow/bin/airflow dags test ads_attribution_pipeline "$(date -u +%F)"
