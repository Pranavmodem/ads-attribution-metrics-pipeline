name: ads_attribution
version: "2.0.0"
config-version: 2
profile: ads_attribution

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests/dbt"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  attribution_window_days: 30
  # The synthetic generator knows each channel's true effect, so models can be
  # scored against it. Set to false when running on real data.
  synthetic_ground_truth: true

models:
  ads_attribution:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    attribution:
      +schema: attribution
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
